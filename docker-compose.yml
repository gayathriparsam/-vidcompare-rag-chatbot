version: "3.9"

services:
  backend:
    build: ./backend
    container_name: vidcompare-backend
    ports: ["8000:8000"]
    env_file: ./backend/.env
    volumes:
      - ./backend/.chroma:/app/.chroma
      - ./backend/sample_data:/app/sample_data
    restart: unless-stopped

  frontend:
    build: ./frontend
    container_name: vidcompare-frontend
    ports: ["3001:3000"]   # host 3001 -> container 3000 (host 3000 is often Grafana)
    environment:
      - NEXT_PUBLIC_API_BASE=http://localhost:8000
    depends_on: [backend]
    restart: unless-stopped
