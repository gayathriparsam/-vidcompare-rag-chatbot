version: "3.9"

services:
  backend:
    build: ./backend
    container_name: vidcompare-backend
    ports: ["8000:8000"]
    env_file: ./backend/.env
    volumes:
      - ./backend/.chroma:/app/.chroma
      - ./backend/sample_data:/app/sample_data
    restart: unless-stopped

  frontend:
    build: ./frontend
    container_name: vidcompare-frontend
    ports: ["3000:3000"]
    environment:
      - NEXT_PUBLIC_API_BASE=http://localhost:8000
    depends_on: [backend]
    restart: unless-stopped
